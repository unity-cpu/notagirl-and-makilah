<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>notagirl and makilah</title>
  <meta name="description" content="photo gallery of notagirl and makilah" />

  <!-- Google Fonts (Caveat + Nunito) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Password gate (shown first) -->
  <div id="password-gate" class="password-gate">
    <div class="password-card">
      <h1>notagirl and makilah</h1>
      <p class="subtitle">Private gallery</p>

      <!-- Decorative divider -->
      <div class="divider">✿</div>

      <p>Enter the password to view our photos</p>

      <form id="password-form">
        <input
          type="password"
          id="password-input"
          placeholder="Password"
          autocomplete="current-password"
          autofocus
        />
        <button type="submit">Unlock</button>
      </form>

      <!-- Error message -->
      <p id="password-error" class="password-error hidden">Wrong password. Try again.</p>
    </div>
  </div>

  <!-- Gallery content (hidden until unlocked) -->
  <div id="app" class="app hidden">
    <header>
      <div class="header-inner">
        <div class="title-group">
          <h1>notagirl and makilah</h1>
        </div>
        <p id="photo-count" class="photo-count">Loading…</p>
      </div>
    </header>

    <main>
      <!-- Gallery grid (populated by JavaScript) -->
      <div id="gallery" class="gallery"></div>

      <!-- Empty state (if no photos) -->
      <div id="empty" class="empty hidden">
        <div class="empty-icon">📷</div>
        <h2>No photos yet</h2>
        <p>leak each other</p>
      </div>

      <!-- Upload section (visible after unlock) -->
      <section class="upload-section" id="upload-section">
        <h2>Add a photo</h2>
        <form id="upload-form">
          <input type="file" id="file-input" accept="image/*" />
          <button type="submit">Upload</button>
        </form>
        <p id="upload-status"></p>
      </section>
      </section>
    </main>
  </div>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true">
    <button id="close-btn" class="lb-btn close" aria-label="Close">×</button>
    <button id="prev-btn" class="lb-btn prev" aria-label="Previous">‹</button>
    <img id="lightbox-img" src="" alt="" />
    <button id="next-btn" class="lb-btn next" aria-label="Next">›</button>
    <p id="lightbox-counter"></p>
  </div>

  <script src="gallery.js"></script>
</body>
</html>
